<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>Elizabeth Tower · 3D demo</title>
<style>
  html,body{margin:0;height:100%;background:#05070d;color:#e9d7a8;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
  #c{display:block;width:100%;height:100%;touch-action:none}
  .ui{position:fixed;left:0;right:0;top:0;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2;
      background:linear-gradient(180deg,rgba(5,7,13,.75),transparent)}
  .ui h1{margin:0;font:600 15px/1.3 Georgia,serif;letter-spacing:.02em}
  .ui p{margin:4px 0 0;opacity:.65;font-size:12px}
  .ui button{pointer-events:auto;background:rgba(201,169,110,.15);border:1px solid rgba(201,169,110,.55);color:#e9d7a8;
    border-radius:999px;padding:8px 14px;font:600 13px system-ui;cursor:pointer}
  .ui button:active{transform:scale(.97)}
  .hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;opacity:.5;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<div class="ui">
  <div>
    <h1>Elizabeth Tower <span style="opacity:.7">· Big Ben</span></h1>
    <p>Procedural 3D demo · History Globe</p>
  </div>
  <button id="replay" type="button">↻ Replay rise</button>
</div>
<p class="hint">Drag to orbit · Pinch / scroll to zoom</p>
<canvas id="c"></canvas>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const canvas = document.getElementById('c');
const MOB = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));

const renderer = new THREE.WebGLRenderer({ canvas, antialias: !MOB, alpha: false, powerPreference: 'high-performance' });
renderer.setClearColor(0x05070d, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const setSize = () => {
  const dpr = Math.min(devicePixelRatio || 1, MOB ? 1.25 : 1.5);
  renderer.setPixelRatio(dpr);
  renderer.setSize(innerWidth, innerHeight, false);
};
setSize();

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070d, 0.032);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(7.5, 6.5, 9.5);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 28;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(0, 3.6, 0);
controls.update();

/* ---- lights ---- */
scene.add(new THREE.HemisphereLight(0xdde6f5, 0x3a3228, 0.55));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.2);
sun.position.set(7, 16, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(MOB ? 512 : 1024, MOB ? 512 : 1024);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 42;
sun.shadow.camera.left = -11;
sun.shadow.camera.right = 11;
sun.shadow.camera.top = 16;
sun.shadow.camera.bottom = -4;
sun.shadow.bias = -0.00035;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x7a8eae, 0.28);
fill.position.set(-6, 5, -7);
scene.add(fill);
const goldGlow = new THREE.PointLight(0xffc43c, 0.55, 18, 2);
goldGlow.position.set(0, 0.4, 0);
scene.add(goldGlow);

/* ---- procedural stone texture ---- */
function makeStoneTex(base = '#c4b089', size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 900; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const a = 0.04 + Math.random() * 0.1;
    ctx.fillStyle = Math.random() > 0.5
      ? `rgba(255,255,240,${a})` : `rgba(60,40,20,${a})`;
    ctx.fillRect(x, y, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  // faint mortar lines
  ctx.strokeStyle = 'rgba(90,70,45,0.18)';
  ctx.lineWidth = 1;
  for (let y = 8; y < size; y += 16) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(size, y); ctx.stroke();
    const off = (y / 16) % 2 ? 16 : 0;
    for (let x = off; x < size; x += 32) {
      ctx.beginPath(); ctx.moveTo(x, y - 16); ctx.lineTo(x, y); ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  return tex;
}

const stoneTex = makeStoneTex('#c4b089', 128);
stoneTex.repeat.set(2, 6);
const stoneDarkTex = makeStoneTex('#9a8160', 128);
stoneDarkTex.repeat.set(1.5, 2);

const matSand = new THREE.MeshStandardMaterial({
  color: 0xc8b58e, map: stoneTex, roughness: 0.72, metalness: 0.04, flatShading: false
});
const matSandDark = new THREE.MeshStandardMaterial({
  color: 0x8f7656, map: stoneDarkTex, roughness: 0.78, metalness: 0.04, flatShading: false
});
const matGold = new THREE.MeshStandardMaterial({
  color: 0xe2b33c, roughness: 0.32, metalness: 0.78, flatShading: false
});
const matIron = new THREE.MeshStandardMaterial({
  color: 0x2a2c32, roughness: 0.55, metalness: 0.7, flatShading: false
});
const matVoid = new THREE.MeshStandardMaterial({
  color: 0x080a10, roughness: 1, metalness: 0, flatShading: true
});
const matGround = new THREE.MeshStandardMaterial({ color: 0x1a1e28, roughness: 0.95, metalness: 0 });

/* ---- geometry helpers (merge by material) ---- */
const buckets = { sand: [], sandDark: [], gold: [], iron: [], void: [] };

function addBox(bucket, w, h, d, x, y, z, rx = 0, ry = 0, rz = 0) {
  const g = new THREE.BoxGeometry(w, h, d);
  g.rotateX(rx); g.rotateY(ry); g.rotateZ(rz);
  g.translate(x, y, z);
  buckets[bucket].push(g);
}
function addCone(bucket, r, h, seg, x, y, z, ry = 0) {
  const g = new THREE.ConeGeometry(r, h, seg);
  g.rotateY(ry);
  g.translate(x, y, z);
  buckets[bucket].push(g);
}
function addCyl(bucket, rt, rb, h, seg, x, y, z) {
  const g = new THREE.CylinderGeometry(rt, rb, h, seg);
  g.translate(x, y, z);
  buckets[bucket].push(g);
}
function addSphere(bucket, r, ws, hs, x, y, z) {
  const g = new THREE.SphereGeometry(r, ws, hs);
  g.translate(x, y, z);
  buckets[bucket].push(g);
}

const tower = new THREE.Group();
scene.add(tower);

/* ========== BUILD MODEL ========== */
const W = 1.55;           // shaft half-ish width
const shaftBase = 0;
const plinthH = 0.55;
const tier1H = 2.4;
const tier2H = 2.5;
const clockH = 1.35;
const belfryH = 1.25;
const lanternH = 0.55;
const spireH = 2.6;

let y = 0;

// --- Plinth / base ---
addBox('sandDark', 2.15, plinthH, 2.15, 0, y + plinthH / 2, 0);
y += plinthH;
addBox('gold', 2.2, 0.06, 2.2, 0, y + 0.03, 0); // gold plinth trim
y += 0.06;

// --- Corner buttresses (full height of shaft) ---
const shaftTop = y + tier1H + tier2H;
const buttOff = 0.92;
for (const [bx, bz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
  const x = bx * buttOff, z = bz * buttOff;
  addBox('sand', 0.28, tier1H + tier2H, 0.28, x, y + (tier1H + tier2H) / 2, z);
  // buttress steps
  addBox('sandDark', 0.34, 0.14, 0.34, x, y + 0.9, z);
  addBox('sandDark', 0.34, 0.14, 0.34, x, y + 2.2, z);
  addBox('sandDark', 0.34, 0.14, 0.34, x, y + 3.6, z);
  // small pinnacle on buttress top (below clock)
  addBox('sandDark', 0.2, 0.16, 0.2, x, shaftTop + 0.08, z);
  addCone('gold', 0.1, 0.45, 4, x, shaftTop + 0.08 + 0.225, z, Math.PI / 4);
}

// --- Tiered shaft ---
function addShaftTier(y0, h, width, rows) {
  addBox('sand', width, h, width, 0, y0 + h / 2, 0);
  // string course top
  addBox('sandDark', width + 0.12, 0.1, width + 0.12, 0, y0 + h + 0.05, 0);
  addBox('gold', width + 0.14, 0.035, width + 0.14, 0, y0 + h + 0.11, 0);

  const face = width / 2 + 0.01;
  for (let side = 0; side < 4; side++) {
    const ang = side * Math.PI / 2;
    const cx = Math.sin(ang), cz = Math.cos(ang);
    for (let row = 0; row < rows; row++) {
      const ry = y0 + 0.35 + row * (h / rows);
      // recessed gothic panel pair
      for (const ox of [-0.32, 0.32]) {
        const px = cx * face + Math.cos(ang) * ox;
        const pz = cz * face - Math.sin(ang) * ox;
        addBox('sandDark', 0.26, 0.55, 0.05, px, ry, pz, 0, ang, 0);
        // pointed arch tip (small diamond)
        addBox('void', 0.18, 0.12, 0.04, px, ry + 0.28, pz + (cz * 0.01), 0, ang, 0);
      }
      // central mullion
      const mx = cx * (face + 0.01);
      const mz = cz * (face + 0.01);
      addBox('sand', 0.05, 0.62, 0.06, mx, ry, mz, 0, ang, 0);
      // horizontal sill
      addBox('sandDark', 0.78, 0.04, 0.06, mx, ry - 0.3, mz, 0, ang, 0);
    }
  }
}

addShaftTier(y, tier1H, 1.7, 3);
y += tier1H + 0.12;
addShaftTier(y, tier2H, 1.62, 3);
y += tier2H + 0.12;

// --- Clock stage ---
const clockY = y + clockH / 2;
addBox('sand', 2.05, clockH, 2.05, 0, clockY, 0);
addBox('gold', 2.15, 0.08, 2.15, 0, y + clockH - 0.02, 0);
addBox('gold', 2.15, 0.06, 2.15, 0, y + 0.04, 0);
// cast-iron corner brackets under clock
for (const [bx, bz] of [[-0.95, -0.95], [0.95, -0.95], [-0.95, 0.95], [0.95, 0.95]]) {
  addBox('iron', 0.14, 0.22, 0.14, bx, y - 0.05, bz);
}

y += clockH;

/* ---- Detailed clock faces (canvas texture, 4 sides) ---- */
function makeClockFace() {
  const S = 512;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  // cast-iron square plate
  ctx.fillStyle = '#2a2c32';
  ctx.fillRect(0, 0, S, S);
  // subtle iron bevel
  ctx.strokeStyle = '#3a3c44';
  ctx.lineWidth = 10;
  ctx.strokeRect(8, 8, S - 16, S - 16);
  // white dial
  ctx.fillStyle = '#f4ecd4';
  ctx.beginPath(); ctx.arc(S/2, S/2, S * 0.42, 0, Math.PI * 2); ctx.fill();
  // gold rim
  ctx.strokeStyle = '#d4a84a';
  ctx.lineWidth = 14;
  ctx.beginPath(); ctx.arc(S/2, S/2, S * 0.42, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#8a6a28';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(S/2, S/2, S * 0.38, 0, Math.PI * 2); ctx.stroke();

  // subtle cast-iron gothic tracery (rings + short radials near rim)
  ctx.strokeStyle = 'rgba(45,40,32,0.28)';
  ctx.lineWidth = 1.25;
  ctx.beginPath(); ctx.arc(S/2, S/2, S*0.16, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(S/2, S/2, S*0.26, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(S/2 + Math.cos(a) * (S*0.16), S/2 + Math.sin(a) * (S*0.16));
    ctx.lineTo(S/2 + Math.cos(a) * (S*0.26), S/2 + Math.sin(a) * (S*0.26));
    ctx.stroke();
  }
  // tiny quatrefoil accents at quarter hours
  ctx.fillStyle = 'rgba(45,40,32,0.22)';
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 - Math.PI / 2;
    const x = S/2 + Math.cos(a) * (S*0.21), y = S/2 + Math.sin(a) * (S*0.21);
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
  }

  // Roman numerals
  const romans = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
  ctx.fillStyle = '#2a2418';
  ctx.font = 'bold 34px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
    const r = Math.round(S * 0.34);
    ctx.fillText(romans[i], S/2 + Math.cos(a) * r, S/2 + Math.sin(a) * r);
  }
  // minute ticks
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2;
    const outer = S * 0.40;
    const inner = outer - (i % 5 === 0 ? 16 : 8);
    ctx.strokeStyle = '#2a2418';
    ctx.lineWidth = i % 5 === 0 ? 3.5 : 1.5;
    ctx.beginPath();
    ctx.moveTo(S/2 + Math.cos(a) * inner, S/2 + Math.sin(a) * inner);
    ctx.lineTo(S/2 + Math.cos(a) * outer, S/2 + Math.sin(a) * outer);
    ctx.stroke();
  }
  // hands (fixed ~10:10 for classic look)
  ctx.strokeStyle = '#1a1814';
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  // hour
  ctx.beginPath();
  ctx.moveTo(S/2, S/2);
  ctx.lineTo(S/2 + Math.cos(-Math.PI/2 + 0.55) * (S*0.20), S/2 + Math.sin(-Math.PI/2 + 0.55) * (S*0.20));
  ctx.stroke();
  // minute
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(S/2, S/2);
  ctx.lineTo(S/2 + Math.cos(-Math.PI/2 + 1.05) * (S*0.30), S/2 + Math.sin(-Math.PI/2 + 1.05) * (S*0.30));
  ctx.stroke();
  // hub
  ctx.fillStyle = '#d4a84a';
  ctx.beginPath(); ctx.arc(S/2, S/2, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a2418';
  ctx.beginPath(); ctx.arc(S/2, S/2, 5, 0, Math.PI * 2); ctx.fill();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}

const clockTex = makeClockFace();
const matClock = new THREE.MeshStandardMaterial({
  map: clockTex, roughness: 0.45, metalness: 0.15, flatShading: false
});

for (let i = 0; i < 4; i++) {
  const ang = i * Math.PI / 2;
  const face = new THREE.Mesh(new THREE.PlaneGeometry(1.12, 1.12), matClock);
  face.position.set(Math.sin(ang) * 1.035, clockY, Math.cos(ang) * 1.035);
  face.rotation.y = ang;
  face.castShadow = true;
  tower.add(face);
  // thin gold outer trim around plate
  addBox('gold', 1.18, 0.04, 0.03,
    Math.sin(ang) * 1.04, clockY + 0.56, Math.cos(ang) * 1.04, 0, ang, 0);
  addBox('gold', 1.18, 0.04, 0.03,
    Math.sin(ang) * 1.04, clockY - 0.56, Math.cos(ang) * 1.04, 0, ang, 0);
}

// --- Belfry ---
const belfryY0 = y;
addBox('sandDark', 1.75, belfryH, 1.75, 0, belfryY0 + belfryH / 2, 0);
// pointed-arch openings + columns
for (let i = 0; i < 4; i++) {
  const ang = i * Math.PI / 2;
  const cx = Math.sin(ang), cz = Math.cos(ang);
  const fz = 0.89;
  // dark opening
  addBox('void', 0.5, 0.72, 0.18, cx * fz, belfryY0 + 0.55, cz * fz, 0, ang, 0);
  // pointed arch cap
  addBox('void', 0.28, 0.22, 0.16, cx * fz, belfryY0 + 0.95, cz * fz, 0, ang, 0);
  // flanking columns
  for (const ox of [-0.32, 0.32]) {
    const px = cx * fz + Math.cos(ang) * ox;
    const pz = cz * fz - Math.sin(ang) * ox;
    addCyl('sand', 0.05, 0.05, 0.85, 6, px, belfryY0 + 0.5, pz);
    addBox('gold', 0.1, 0.05, 0.1, px, belfryY0 + 0.95, pz);
  }
  // gold arch lintel
  addBox('gold', 0.58, 0.07, 0.1, cx * (fz + 0.02), belfryY0 + 1.05, cz * (fz + 0.02), 0, ang, 0);
}
y += belfryH;

// cornice
addBox('gold', 1.95, 0.12, 1.95, 0, y + 0.06, 0);
addBox('sand', 1.85, 0.18, 1.85, 0, y + 0.2, 0);
y += 0.3;

// corner pinnacles / spirelets at belfry
for (const [bx, bz] of [[-0.78, -0.78], [0.78, -0.78], [-0.78, 0.78], [0.78, 0.78]]) {
  addBox('sandDark', 0.18, 0.22, 0.18, bx, y + 0.05, bz);
  addCone('gold', 0.1, 0.7, 4, bx, y + 0.05 + 0.35, bz, Math.PI / 4);
  addSphere('gold', 0.04, 6, 4, bx, y + 0.05 + 0.72, bz);
}

// --- Lantern / Ayrton light ---
addBox('sand', 0.72, lanternH, 0.72, 0, y + lanternH / 2, 0);
for (let i = 0; i < 4; i++) {
  const ang = i * Math.PI / 2;
  addBox('void', 0.28, 0.32, 0.08,
    Math.sin(ang) * 0.37, y + lanternH / 2, Math.cos(ang) * 0.37, 0, ang, 0);
  addBox('gold', 0.32, 0.04, 0.06,
    Math.sin(ang) * 0.38, y + lanternH - 0.06, Math.cos(ang) * 0.38, 0, ang, 0);
}
// glowing Ayrton sphere
const ayrton = new THREE.Mesh(
  new THREE.SphereGeometry(0.12, 10, 8),
  new THREE.MeshStandardMaterial({ color: 0xffe08a, emissive: 0xffb020, emissiveIntensity: 0.9, roughness: 0.4 })
);
ayrton.position.set(0, y + lanternH / 2, 0);
tower.add(ayrton);
const ayrtonLight = new THREE.PointLight(0xffc040, 0.35, 8, 2);
ayrtonLight.position.copy(ayrton.position);
tower.add(ayrtonLight);
y += lanternH;

// --- Ornate cast-iron spire ---
addBox('iron', 0.55, 0.2, 0.55, 0, y + 0.1, 0);
addBox('gold', 0.6, 0.05, 0.6, 0, y + 0.22, 0);
y += 0.25;

// tapered iron stages
const stages = [
  { r: 0.42, h: 0.55 },
  { r: 0.32, h: 0.55 },
  { r: 0.22, h: 0.55 },
  { r: 0.14, h: 0.5 }
];
for (const s of stages) {
  addCone('iron', s.r, s.h, 4, 0, y + s.h / 2, 0, Math.PI / 4);
  addBox('gold', s.r * 1.3, 0.04, s.r * 1.3, 0, y + s.h - 0.02, 0);
  // tiny finial rings
  addCyl('gold', s.r * 0.35, s.r * 0.35, 0.03, 8, 0, y + s.h * 0.5, 0);
  y += s.h;
}

// gold tip + ball + weathervane nub
addCone('gold', 0.08, 0.45, 4, 0, y + 0.22, 0, Math.PI / 4);
addSphere('gold', 0.07, 8, 6, 0, y + 0.48, 0);
addCyl('gold', 0.015, 0.015, 0.25, 4, 0, y + 0.65, 0);
addBox('gold', 0.18, 0.02, 0.04, 0, y + 0.72, 0); // crossbar
y += 0.85;

const TOWER_H = y;

/* ---- merge buckets into few meshes ---- */
const matMap = {
  sand: matSand, sandDark: matSandDark, gold: matGold, iron: matIron, void: matVoid
};
for (const [key, geos] of Object.entries(buckets)) {
  if (!geos.length) continue;
  const merged = mergeGeometries(geos, false);
  if (!merged) continue;
  const mesh = new THREE.Mesh(merged, matMap[key]);
  mesh.castShadow = key !== 'void';
  mesh.receiveShadow = true;
  tower.add(mesh);
  for (const g of geos) g.dispose();
}

/* ---- ground ---- */
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 48), matGround);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const ringG = new THREE.Mesh(
  new THREE.RingGeometry(12, 12.15, 64),
  new THREE.MeshBasicMaterial({ color: 0x3a3428, side: THREE.DoubleSide })
);
ringG.rotation.x = -Math.PI / 2;
ringG.position.y = 0.01;
scene.add(ringG);

/* ---- dust ---- */
const DUST_N = MOB ? 48 : 80;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_N * 3);
const dustVel = [];
for (let i = 0; i < DUST_N; i++) {
  dustPos[i * 3] = 0; dustPos[i * 3 + 1] = -1; dustPos[i * 3 + 2] = 0;
  dustVel.push({ vx: 0, vy: 0, vz: 0, life: 0 });
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  color: 0xffc43c, size: 0.12, transparent: true, opacity: 0.85,
  depthWrite: false, sizeAttenuation: true
});
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

function burstDust() {
  for (let i = 0; i < DUST_N; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 0.3 + Math.random() * 1.2;
    dustPos[i * 3] = Math.cos(a) * r;
    dustPos[i * 3 + 1] = 0.05 + Math.random() * 0.2;
    dustPos[i * 3 + 2] = Math.sin(a) * r;
    dustVel[i].vx = Math.cos(a) * (0.4 + Math.random() * 1.2);
    dustVel[i].vz = Math.sin(a) * (0.4 + Math.random() * 1.2);
    dustVel[i].vy = 0.8 + Math.random() * 2.2;
    dustVel[i].life = 0.6 + Math.random() * 1.2;
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustMat.opacity = 0.9;
}

/* ---- rise ---- */
let riseT = 0;
let rising = true;
const RISE_DUR = 2.4;
tower.position.y = -TOWER_H;

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function startRise() {
  riseT = 0;
  rising = true;
  tower.position.y = -TOWER_H;
  goldGlow.intensity = 1.4;
  burstDust();
  needRender = true;
  resumeLoop();
}

document.getElementById('replay').onclick = startRise;

/* ---- render on demand ---- */
let needRender = true;
let looping = false;
let last = performance.now();

function resumeLoop() {
  if (!looping) {
    looping = true;
    last = performance.now();
    requestAnimationFrame(loop);
  }
}

controls.addEventListener('change', () => { needRender = true; resumeLoop(); });
addEventListener('pointerdown', () => resumeLoop(), { passive: true });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  setSize();
  needRender = true;
  resumeLoop();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { needRender = true; resumeLoop(); }
});

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  let alive = needRender || rising || dustMat.opacity > 0.02;

  if (rising) {
    riseT += dt;
    const u = Math.min(1, riseT / RISE_DUR);
    const e = easeOutCubic(u);
    tower.position.y = -TOWER_H * (1 - e);
    goldGlow.intensity = 1.4 - 0.85 * e;
    goldGlow.position.y = Math.max(0.3, tower.position.y + 0.5);
    if (u >= 1) {
      rising = false;
      tower.position.y = 0;
      goldGlow.intensity = 0.45;
      goldGlow.position.y = 0.4;
    }
    needRender = true;
    alive = true;
  }

  if (dustMat.opacity > 0.02) {
    const pos = dustGeo.attributes.position.array;
    let any = false;
    for (let i = 0; i < DUST_N; i++) {
      const v = dustVel[i];
      if (v.life <= 0) continue;
      any = true;
      v.life -= dt;
      v.vy -= 2.8 * dt;
      pos[i * 3] += v.vx * dt;
      pos[i * 3 + 1] += v.vy * dt;
      pos[i * 3 + 2] += v.vz * dt;
      v.vx *= 0.98; v.vz *= 0.98;
    }
    dustGeo.attributes.position.needsUpdate = true;
    dustMat.opacity = any ? Math.min(0.9, dustMat.opacity) : Math.max(0, dustMat.opacity - dt * 0.6);
    if (!any) dustMat.opacity = Math.max(0, dustMat.opacity - dt);
    needRender = true;
    alive = true;
  }

  if (controls.enableDamping) {
    controls.update();
    alive = true;
  }

  if (needRender || rising) {
    renderer.render(scene, camera);
    needRender = false;
  }

  if (alive && !document.hidden) {
    requestAnimationFrame(loop);
  } else {
    looping = false;
  }
}

window.__BB = {
  startRise,
  setCamera: (x, y, z, tx = 0, ty = 3.6, tz = 0) => {
    camera.position.set(x, y, z);
    controls.target.set(tx, ty, tz);
    controls.update();
    needRender = true;
    resumeLoop();
  },
  ready: true,
  towerH: TOWER_H
};

startRise();
resumeLoop();
</script>
