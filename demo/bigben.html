<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>Elizabeth Tower · 3D demo</title>
<style>
  html,body{margin:0;height:100%;background:#05070d;color:#e9d7a8;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
  #c{display:block;width:100%;height:100%;touch-action:none}
  .ui{position:fixed;left:0;right:0;top:0;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2;
      background:linear-gradient(180deg,rgba(5,7,13,.75),transparent)}
  .ui h1{margin:0;font:600 15px/1.3 Georgia,serif;letter-spacing:.02em}
  .ui p{margin:4px 0 0;opacity:.65;font-size:12px}
  .ui button{pointer-events:auto;background:rgba(201,169,110,.15);border:1px solid rgba(201,169,110,.55);color:#e9d7a8;
    border-radius:999px;padding:8px 14px;font:600 13px system-ui;cursor:pointer}
  .ui button:active{transform:scale(.97)}
  .hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;opacity:.5;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<div class="ui">
  <div>
    <h1>Elizabeth Tower <span style="opacity:.7">· Big Ben</span></h1>
    <p>Low-poly 3D demo · History Globe</p>
  </div>
  <button id="replay" type="button">↻ Replay rise</button>
</div>
<p class="hint">Drag to orbit · Pinch / scroll to zoom</p>
<canvas id="c"></canvas>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const MOB = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));

const renderer = new THREE.WebGLRenderer({ canvas, antialias: !MOB, alpha: false, powerPreference: 'high-performance' });
renderer.setClearColor(0x05070d, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const setSize = () => {
  const dpr = Math.min(devicePixelRatio || 1, MOB ? 1.25 : 1.5);
  renderer.setPixelRatio(dpr);
  renderer.setSize(innerWidth, innerHeight, false);
};
setSize();

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070d, 0.035);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(7.5, 6.5, 9.5);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 28;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(0, 3.2, 0);
controls.update();

/* ---- lights (cheap) ---- */
scene.add(new THREE.AmbientLight(0xb8c4d8, 0.45));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.15);
sun.position.set(6, 14, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(MOB ? 512 : 1024, MOB ? 512 : 1024);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 40;
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 14;
sun.shadow.camera.bottom = -4;
sun.shadow.bias = -0.0003;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8899bb, 0.35);
fill.position.set(-5, 4, -6);
scene.add(fill);
const goldGlow = new THREE.PointLight(0xffc43c, 0.55, 18, 2);
goldGlow.position.set(0, 0.4, 0);
scene.add(goldGlow);

/* ---- materials ---- */
const matSand = new THREE.MeshStandardMaterial({ color: 0xc4b089, roughness: 0.55, metalness: 0.05, flatShading: true });
const matSandDark = new THREE.MeshStandardMaterial({ color: 0x8a7355, roughness: 0.6, metalness: 0.05, flatShading: true });
const matGold = new THREE.MeshStandardMaterial({ color: 0xe2b33c, roughness: 0.35, metalness: 0.65, flatShading: true });
const matClock = new THREE.MeshStandardMaterial({ color: 0xf5ecd0, roughness: 0.4, metalness: 0.1, flatShading: true });
const matHand = new THREE.MeshBasicMaterial({ color: 0x2a2418 });
const matGround = new THREE.MeshStandardMaterial({ color: 0x1a1e28, roughness: 0.95, metalness: 0 });

function box(w, h, d, mat, y = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.y = y;
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

/* ---- procedural Elizabeth Tower ---- */
const tower = new THREE.Group();
scene.add(tower);

// Shaft
const shaftH = 5.2;
const shaft = box(1.55, shaftH, 1.55, matSand, shaftH / 2);
tower.add(shaft);

// Gothic panel strips (4 sides) — inset boxes as relief
for (let side = 0; side < 4; side++) {
  const g = new THREE.Group();
  g.rotation.y = side * Math.PI / 2;
  for (let row = 0; row < 5; row++) {
    const panel = box(0.28, 0.72, 0.06, matSandDark, 0.7 + row * 0.9);
    panel.position.z = 0.79;
    panel.position.x = -0.38;
    g.add(panel);
    const panel2 = panel.clone();
    panel2.position.x = 0.38;
    g.add(panel2);
    // thin mullion
    const mull = box(0.05, 0.72, 0.07, matSand, 0.7 + row * 0.9);
    mull.position.z = 0.80;
    g.add(mull);
  }
  tower.add(g);
}

// Clock stage (wider)
const clockStage = box(1.95, 1.15, 1.95, matSand, shaftH + 0.55);
tower.add(clockStage);
const clockTrim = box(2.05, 0.12, 2.05, matGold, shaftH + 1.18);
tower.add(clockTrim);

// 4 clock faces + hands
const clockY = shaftH + 0.55;
for (let i = 0; i < 4; i++) {
  const face = new THREE.Mesh(new THREE.CircleGeometry(0.42, 24), matClock);
  face.position.set(0, clockY, 0.98);
  face.castShadow = true;
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.48, 28), matGold);
  ring.position.copy(face.position);
  ring.position.z += 0.001;
  const hour = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.22, 0.02), matHand);
  hour.position.set(0, clockY + 0.06, 0.99);
  hour.rotation.z = -0.4;
  const minute = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.32, 0.02), matHand);
  minute.position.set(0.05, clockY + 0.08, 0.995);
  minute.rotation.z = 0.9;
  const hub = new THREE.Mesh(new THREE.CircleGeometry(0.04, 10), matGold);
  hub.position.set(0, clockY, 1.0);
  const g = new THREE.Group();
  g.rotation.y = i * Math.PI / 2;
  g.add(face, ring, hour, minute, hub);
  // hour markers
  for (let h = 0; h < 12; h++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.07, 0.015), matHand);
    const a = (h / 12) * Math.PI * 2;
    m.position.set(Math.sin(a) * 0.34, clockY + Math.cos(a) * 0.34, 0.99);
    m.rotation.z = -a;
    g.add(m);
  }
  tower.add(g);
}

// Belfry with arched openings
const belfryY = shaftH + 1.35;
const belfry = box(1.7, 1.1, 1.7, matSandDark, belfryY + 0.55);
tower.add(belfry);
for (let i = 0; i < 4; i++) {
  const archHole = new THREE.Mesh(
    new THREE.BoxGeometry(0.55, 0.7, 0.2),
    new THREE.MeshStandardMaterial({ color: 0x0a0c12, roughness: 1, flatShading: true })
  );
  const g = new THREE.Group();
  g.rotation.y = i * Math.PI / 2;
  archHole.position.set(0, belfryY + 0.5, 0.86);
  g.add(archHole);
  // gold arch lintel
  const lintel = box(0.62, 0.08, 0.12, matGold, belfryY + 0.88);
  lintel.position.z = 0.88;
  g.add(lintel);
  tower.add(g);
}

// Cornice + pinnacles at corners
const cornice = box(1.95, 0.18, 1.95, matGold, belfryY + 1.2);
tower.add(cornice);
const pinH = 0.85;
for (const [x, z] of [[-0.85, -0.85], [0.85, -0.85], [-0.85, 0.85], [0.85, 0.85]]) {
  const pin = new THREE.Mesh(new THREE.ConeGeometry(0.12, pinH, 4), matGold);
  pin.position.set(x, belfryY + 1.3 + pinH / 2, z);
  pin.castShadow = true;
  pin.rotation.y = Math.PI / 4;
  tower.add(pin);
  const base = box(0.18, 0.12, 0.18, matSandDark, belfryY + 1.28);
  base.position.set(x, belfryY + 1.28, z);
  tower.add(base);
}

// Main spire
const spireBase = box(0.85, 0.35, 0.85, matSand, belfryY + 1.45);
tower.add(spireBase);
const spire = new THREE.Mesh(new THREE.ConeGeometry(0.55, 2.4, 4), matSandDark);
spire.position.y = belfryY + 1.6 + 1.2;
spire.rotation.y = Math.PI / 4;
spire.castShadow = true;
tower.add(spire);
const tip = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.55, 4), matGold);
tip.position.y = belfryY + 1.6 + 2.4 + 0.15;
tip.rotation.y = Math.PI / 4;
tip.castShadow = true;
tower.add(tip);
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), matGold);
ball.position.y = tip.position.y + 0.28;
tower.add(ball);

const TOWER_H = tip.position.y + 0.35; // ~10

/* ---- ground ---- */
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 48), matGround);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
// horizon ring
const ringG = new THREE.Mesh(
  new THREE.RingGeometry(12, 12.15, 64),
  new THREE.MeshBasicMaterial({ color: 0x3a3428, side: THREE.DoubleSide })
);
ringG.rotation.x = -Math.PI / 2;
ringG.position.y = 0.01;
scene.add(ringG);

/* ---- dust particles ---- */
const DUST_N = MOB ? 48 : 80;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_N * 3);
const dustVel = [];
for (let i = 0; i < DUST_N; i++) {
  dustPos[i * 3] = 0; dustPos[i * 3 + 1] = -1; dustPos[i * 3 + 2] = 0;
  dustVel.push({ vx: 0, vy: 0, vz: 0, life: 0 });
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  color: 0xffc43c, size: 0.12, transparent: true, opacity: 0.85,
  depthWrite: false, sizeAttenuation: true
});
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

function burstDust() {
  for (let i = 0; i < DUST_N; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 0.3 + Math.random() * 1.2;
    dustPos[i * 3] = Math.cos(a) * r;
    dustPos[i * 3 + 1] = 0.05 + Math.random() * 0.2;
    dustPos[i * 3 + 2] = Math.sin(a) * r;
    dustVel[i].vx = Math.cos(a) * (0.4 + Math.random() * 1.2);
    dustVel[i].vz = Math.sin(a) * (0.4 + Math.random() * 1.2);
    dustVel[i].vy = 0.8 + Math.random() * 2.2;
    dustVel[i].life = 0.6 + Math.random() * 1.2;
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustMat.opacity = 0.9;
}

/* ---- rise animation ---- */
let riseT = 0;
let rising = true;
const RISE_DUR = 2.4;
tower.position.y = -TOWER_H;

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function startRise() {
  riseT = 0;
  rising = true;
  tower.position.y = -TOWER_H;
  goldGlow.intensity = 1.4;
  burstDust();
  needRender = true;
  resumeLoop();
}

document.getElementById('replay').onclick = startRise;

/* ---- render on demand ---- */
let needRender = true;
let looping = false;
let last = performance.now();

function resumeLoop() {
  if (!looping) {
    looping = true;
    last = performance.now();
    requestAnimationFrame(loop);
  }
}

controls.addEventListener('change', () => { needRender = true; resumeLoop(); });
addEventListener('pointerdown', () => resumeLoop(), { passive: true });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  setSize();
  needRender = true;
  resumeLoop();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { needRender = true; resumeLoop(); }
});

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  let alive = needRender || rising || dustMat.opacity > 0.02;

  if (rising) {
    riseT += dt;
    const u = Math.min(1, riseT / RISE_DUR);
    const e = easeOutCubic(u);
    tower.position.y = -TOWER_H * (1 - e);
    goldGlow.intensity = 1.4 - 0.85 * e;
    goldGlow.position.y = Math.max(0.3, tower.position.y + 0.5);
    if (u >= 1) {
      rising = false;
      tower.position.y = 0;
      goldGlow.intensity = 0.45;
      goldGlow.position.y = 0.4;
    }
    needRender = true;
    alive = true;
  }

  // dust update
  if (dustMat.opacity > 0.02) {
    const pos = dustGeo.attributes.position.array;
    let any = false;
    for (let i = 0; i < DUST_N; i++) {
      const v = dustVel[i];
      if (v.life <= 0) continue;
      any = true;
      v.life -= dt;
      v.vy -= 2.8 * dt;
      pos[i * 3] += v.vx * dt;
      pos[i * 3 + 1] += v.vy * dt;
      pos[i * 3 + 2] += v.vz * dt;
      v.vx *= 0.98; v.vz *= 0.98;
    }
    dustGeo.attributes.position.needsUpdate = true;
    dustMat.opacity = any ? Math.min(0.9, dustMat.opacity) : Math.max(0, dustMat.opacity - dt * 0.6);
    if (!any) dustMat.opacity = Math.max(0, dustMat.opacity - dt);
    needRender = true;
    alive = true;
  }

  if (controls.enableDamping) {
    controls.update();
    // damping keeps moving briefly
    alive = true;
  }

  if (needRender || rising) {
    renderer.render(scene, camera);
    needRender = false;
  }

  if (alive && !document.hidden) {
    requestAnimationFrame(loop);
  } else {
    looping = false;
  }
}

// expose for GIF capture
window.__BB = {
  startRise,
  setCamera: (x, y, z, tx = 0, ty = 3.2, tz = 0) => {
    camera.position.set(x, y, z);
    controls.target.set(tx, ty, tz);
    controls.update();
    needRender = true;
    resumeLoop();
  },
  ready: true
};

startRise();
resumeLoop();
</script>
</body>
</html>
